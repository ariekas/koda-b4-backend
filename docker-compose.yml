services:
  app:
    build: .
    container_name: justsruput_backend
    ports:
      - 8081:8080
    env_file:
      - .env
    restart: unless-stopped
  db: 
    image: postgres:16-alpine
    container_name: justsruput_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1
      - POSTGRES_DB=dbcoffeshop
    ports:
      - 5432:5432
    restart: always
  redis:
    image: redis:7-alpine
    container_name: justsruput_redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - 6379:6379
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    restart: always